name: Update Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate Profile Cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: theparidhisharma
          cards: overview,lifetime,contributions,composition,rhythm,cadence,repositories,languages
          output-dir: assets
          themes: light,dark
          commit: true
          commit-message: "chore(profile): refresh GitHub stats [skip ci]"
